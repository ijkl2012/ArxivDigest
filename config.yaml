interest: |
  I am interested in classification-oriented machine learning methods for medical and physiological signals, especially test-time adaptation, continual test-time adaptation, online test-time adaptation, source-free domain adaptation, domain generalization, and test-time training for biomedical signal classification.

  My main application area is cardiac screening and diagnosis based on ECG, PCG, heart sound, phonocardiogram, and multimodal PCG-ECG signals. I am especially interested in congenital heart disease screening, cardiac auscultation, pediatric cardiac diagnosis, ECG classification, heart sound classification, and robust physiological time-series classification.

  Please prioritize papers that propose new classification methods, adaptation methods, reliability estimation methods, or robust learning frameworks for time-series classification, biomedical signal classification, multimodal classification, or domain-shifted classification tasks.

  High-priority topics include reliability-aware test-time adaptation, uncertainty-aware classification, entropy minimization, prototype-based adaptation, patient-specific adaptation, single-sample adaptation, single-patient adaptation, source-free adaptation, safe model adaptation, source-model anchoring, trust-region adaptation, missing-modality classification, modality degradation, multimodal fusion, cross-modal consistency, physiological consistency, quasi-periodic time-series modeling, cardiac cycle modeling, and repeated-measures modeling.

  Please also include relevant general machine learning, computer vision, or audio classification papers if their method can be transferred to physiological time-series classification or multimodal medical signal classification.

  Please down-rank papers that are mainly about large language models, NLP, text generation, image generation, diffusion models for image synthesis, radiology image segmentation, pathology image analysis, object detection, robotics, reinforcement learning, speech recognition, music generation, or pure clinical case studies without transferable machine learning methodology.
